<script>
                        for(let i=0; i<240; i++) {
                            const height = Math.floor(Math.random() * 85) + 5;
                            let colorClass = 'bg-slate-700'; 
                            let opacity = '0.4';
                            const rnd = Math.random();
                            if (i < 84) { 
                                if (rnd > 0.95) colorClass = 'bg-cyan-400';
                                else if (rnd > 0.90) colorClass = 'bg-cyan-600';
                                else colorClass = 'bg-cyan-800'; 
                                opacity = '0.8';
                            } else {
                                if (rnd > 0.98) colorClass = 'bg-slate-500';
                            }
                            document.write(`<div class="w-full rounded-t-sm ${colorClass} waveform-bar" style="height: ${height}%; opacity: ${opacity};"></div>`);
                        }
